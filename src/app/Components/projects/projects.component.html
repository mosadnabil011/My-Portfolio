<section id="projects" class="section-shell projects-section">
  <div class="container">
    <div class="section-head" data-aos="fade-up">
      <span class="section-tag">Projects</span>
      <h2 class="section-title">Selected work and interface design experiments.</h2>
    </div>

    <div class="row g-4">
      <div class="col-lg-4 col-md-6" *ngFor="let project of projects; let i = index" [attr.data-aos]="i % 2 === 0 ? 'fade-up' : 'fade-up'" [attr.data-aos-delay]="i * 80">
        <article class="project-card glass-card">
          <div class="project-image-wrap">
            <img [src]="project.image" [alt]="project.title" class="project-image" />
          </div>

          <div class="project-body">
            <h3>{{ project.title }}</h3>
            <p>{{ project.description }}</p>
          </div>

          <div class="project-footer">
            <a [href]="project.link" target="_blank" rel="noreferrer" class="secondary-btn project-btn">
              View Project
            </a>
          </div>
        </article>
      </div>
    </div>
  </div>
</section>
